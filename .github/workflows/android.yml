name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.0.1 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the web app and run the rules engine tests
        run: |
          node build.js
          node test/engine.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) with licences accepted.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Pick the version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$INPUT_VERSION"; fi
          if [ -z "$V" ] && [ -f version.txt ]; then V="$(tr -d '[:space:]' < version.txt)"; fi
          if [ -z "$V" ]; then V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Load the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Pasted secrets often pick up spaces or line breaks: strip all whitespace before decoding.
            if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              echo "::error title=Signing key::ANDROID_KEYSTORE_BASE64 is not valid base64. Paste the whole content of keystore.base64.txt again."
              exit 1
            fi
            PASS="$(printf '%s' "$KS_PASS" | tr -d '[:space:]')"
            ALIAS="$(printf '%s' "$KS_ALIAS" | tr -d '[:space:]')"
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "::error title=Signing key::The keystore did not open with ANDROID_KEYSTORE_PASSWORD and alias '$ALIAS'. Check those two secrets."
              exit 1
            fi
            echo "::add-mask::$PASS"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with the debug key."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${GITHUB_RUN_NUMBER}" > gradle.log 2>&1
          code=$?
          tail -n 60 gradle.log
          if [ $code -ne 0 ]; then
            # Surface the cause as an annotation so it is visible without opening the full log.
            msg=$( (grep -n -A 25 "What went wrong" gradle.log; grep -n -E "error:|ERROR:|e: " gradle.log | head -n 20) | head -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "GullyCricket-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GullyCricket-${{ steps.ver.outputs.name }}
          path: GullyCricket-*.apk

      # A push to main publishes version.txt as a release once, and only when the real signing key is set.
      - name: Decide whether to publish a release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$SIGNING" = "release" ] && ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release published (signing: $SIGNING, version v$V). The APK is in this run's artifacts."
          fi

      - name: Publish the GitHub release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Gully Cricket ${{ steps.ver.outputs.name }}
          files: GullyCricket-*.apk
          prerelease: ${{ env.SIGNING != 'release' }}
          body: |
            ## Install on Android
            1. Download **GullyCricket-${{ steps.ver.outputs.name }}.apk** from *Assets* below.
            2. Open the file. If Android asks, allow **Install unknown apps** for your browser or Files app.
            3. If Play Protect warns about an unknown developer, tap **More details → Install anyway**.

            Works offline. Teams and matches stay on your phone; move them with **Settings → Backup**.

            ## ಆಂಡ್ರಾಯ್ಡ್‌ನಲ್ಲಿ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡುವುದು
            1. ಕೆಳಗಿನ *Assets* ನಲ್ಲಿ **GullyCricket-${{ steps.ver.outputs.name }}.apk** ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ.
            2. ಫೈಲ್ ತೆರೆಯಿರಿ. ಕೇಳಿದರೆ **Install unknown apps** ಅನುಮತಿ ನೀಡಿ.
            3. Play Protect ಎಚ್ಚರಿಕೆ ಬಂದರೆ **More details → Install anyway** ಒತ್ತಿ.
