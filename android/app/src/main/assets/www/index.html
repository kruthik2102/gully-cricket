}
:root[data-theme="light"] {

  --glow-c: rgba(36, 196, 166, .28);

  --ball-deep: #9CB812;

/* Surface indirection: Solid look, reduced transparency and high contrast swap glass for solid fills. */
:root {
  --s-pane: var(--pane);
  --s-glass: var(--glass);
  --s-glass-hi: var(--glass-hi);
  --s-sheet: var(--glass-sheet);
  --blur: blur(18px) saturate(170%);
}
@media (prefers-reduced-transparency: reduce) {
  :root { --s-pane: var(--pane-solid); --s-glass: var(--solid-2); --s-glass-hi: var(--solid-2); --s-sheet: var(--pane-solid); --blur: none; }
}
@media (prefers-contrast: more) {
  :root { --s-pane: var(--pane-solid); --s-glass: var(--solid-2); --s-glass-hi: var(--solid-2); --s-sheet: var(--pane-solid); --blur: none; --rim: var(--ink-3); }
}
html[data-glass="off"] { --s-pane: var(--pane-solid); --s-glass: var(--solid-2); --s-glass-hi: var(--solid-2); --s-sheet: var(--pane-solid); --blur: none; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { min-height: 100%; }
body { background: var(--field); color: var(--ink); font: 400 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
html[lang="kn"] body { line-height: 1.6; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.field-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(62% 42% at 6% 2%, var(--glow-a), transparent 72%),
    radial-gradient(56% 40% at 100% 30%, var(--glow-b), transparent 70%),
    radial-gradient(72% 46% at 18% 100%, var(--glow-c), transparent 72%),
    var(--field);
}

#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 36px; display: flex; flex-direction: column; gap: 12px; }
#app.has-bar { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
/* Screen entrance: slide from the side the screen logically comes from, panels staggered 30ms. */
#app.enter > * { animation: inFwd .28s var(--ease-out) both; }
#app.dir-back > * { animation-name: inBack; }
#app.dir-right > * { animation-name: inRight; }
#app.dir-left > * { animation-name: inLeft; }
#app.enter > *:nth-child(2) { animation-delay: .03s; }
#app.enter > *:nth-child(3) { animation-delay: .06s; }
#app.enter > *:nth-child(4) { animation-delay: .09s; }
#app.enter > *:nth-child(5) { animation-delay: .12s; }
#app.enter > *:nth-child(n+6) { animation-delay: .15s; }
@keyframes inFwd { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes inBack { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
@keyframes inRight { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: none; } }
@keyframes inLeft { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes settle { from { transform: scale(.95); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#app.enter .list > * { animation: rowIn .3s var(--ease-out) both; animation-delay: calc(.08s + var(--k, 0) * 40ms); }

/* ---------- surfaces ---------- */
.pane {
  position: relative; border-radius: var(--r-pane); padding: 18px;
  background: var(--s-pane);
  box-shadow: var(--shadow-sm), inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--rim);
}
.glass { background: var(--s-glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

/* ---------- type ---------- */
.display { margin: 6px 0; font: 800 34px/1.02 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
html[lang="kn"] .display { text-transform: none; font-size: 26px; line-height: 1.32; }
.sec { margin: 0 0 12px; font: 700 18px/1.15 var(--f-display); letter-spacing: .05em; text-transform: uppercase; text-wrap: balance; }
html[lang="kn"] .sec { text-transform: none; letter-spacing: 0; font-size: 17px; }
.eyebrow { margin: 0; display: flex; align-items: center; gap: 8px; font: 700 12px/1.3 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
html[lang="kn"] .eyebrow { letter-spacing: .02em; }
.label { margin: 14px 0 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.meta { margin: 6px 0 0; color: var(--ink-3); font-size: 13px; }
.center { text-align: center; }
.big-line { margin: 4px 0; font-size: 18px; font-weight: 700; text-wrap: balance; }
.vs { color: var(--ink-3); font-weight: 600; font-size: .85em; padding: 0 4px; }

/* ---------- controls ---------- */
.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 20px; border: 0; border-radius: 999px;
  font: 650 15px/1.2 var(--f-body); color: var(--ink); text-align: center; white-space: normal;
  background: var(--s-glass-hi);
  box-shadow: inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--rim);
  transition: transform .16s var(--ease-out), background-color .2s ease, color .2s ease, box-shadow .2s ease;
}
.pill:active { transform: scale(.97); background: var(--glass-press); }
.row-item, .cap-tile, .potd-mini, .pick, .menu-item, .chip, .mod, .option, .tab, .key { transition: transform .16s var(--ease-out), background-color .2s ease, color .2s ease, box-shadow .2s ease; }
.row-item:active, .cap-tile:active, .potd-mini:active, .pick:active:not(:disabled), .menu-item:active, .chip:active, .mod:active, .tab:active { transform: scale(.97); }
.pill.primary { background: var(--ball); color: var(--ball-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 6px 18px var(--on-ball-glow); }
.pill.danger { background: var(--tape); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
.pill.danger-soft { color: var(--tape); }
.pill.ok { background: var(--ok); color: #03140C; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
.pill.on, .pill[aria-pressed="true"] { background: var(--ink); color: var(--field); box-shadow: none; }
.pill:disabled { opacity: .42; cursor: not-allowed; transform: none; }
.pill[aria-pressed="true"]:disabled { opacity: .92; }
.pill.wide { width: 100%; }
.pill-sm { min-height: 44px; padding: 6px 14px; font-size: 13px; }
.pill-lg { min-height: 56px; font-size: 16px; }
.pill-xl { min-height: 64px; font-size: 18px; padding-inline: 26px; }
.pill svg { flex: none; }

.icon-btn {
  width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; display: grid; place-items: center;
  color: var(--ink); background: var(--s-glass);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--rim);
}
.icon-btn:active { transform: scale(.94); }
.icon-spacer { width: 44px; height: 44px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px;
  border: 0; border-radius: 999px; background: var(--pane-2); color: var(--ink);
  font: 600 14px/1.2 var(--f-body); box-shadow: inset 0 0 0 1px var(--line);
}
.chip.on { background: var(--ink); color: var(--field); box-shadow: none; }
.chip:disabled { opacity: .38; cursor: not-allowed; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.chip small { opacity: .62; font: 700 13px/1 var(--f-num); }

.seg {
  position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr));
  padding: 4px; border-radius: 999px; background: var(--pane-2); box-shadow: inset 0 0 0 1px var(--line);
}
.seg-thumb {
  position: absolute; top: 4px; bottom: 4px; border-radius: 999px;
  left: calc(4px + var(--i) * ((100% - 8px) / var(--n))); width: calc((100% - 8px) / var(--n));
  background: var(--thumb); box-shadow: var(--shadow-sm), inset 0 1px 0 var(--rim-top);
  transition: left .3s var(--ease-in-out);
}
.seg button {
  position: relative; z-index: 1; min-height: 44px; padding: 6px 8px; border: 0; border-radius: 999px;
  background: none; color: var(--ink-2); font: 650 14px/1.15 var(--f-body); min-width: 0; overflow-wrap: anywhere;
}
.seg button { transition: color .25s ease; }
.seg button[aria-checked="true"] { color: var(--ink); }

.row-switch {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%;
  min-height: 54px; padding: 8px 0; border: 0; background: none; color: inherit; text-align: left;
}
.row-switch + .row-switch { border-top: 1px solid var(--line); }
.rs-text { min-width: 0; }
.rs-label { display: block; font-weight: 650; }
.rs-sub { display: block; color: var(--ink-3); font-size: 13px; }
.switch { position: relative; flex: none; width: 52px; height: 32px; border-radius: 999px; background: var(--pane-2); box-shadow: inset 0 0 0 1px var(--line); transition: background-color .25s ease, box-shadow .25s ease; }
.switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: transform .28s var(--ease-out), width .18s var(--ease-out); }
.row-switch:active .switch i { width: 32px; }
.row-switch[aria-checked="true"]:active .switch i { transform: translateX(14px); }
.row-switch[aria-checked="true"] .switch { background: var(--ball); box-shadow: none; }
.row-switch[aria-checked="true"] .switch i { transform: translateX(20px); }

.field {
  width: 100%; min-height: 48px; padding: 10px 18px; border: 0; border-radius: 999px;
  background: var(--pane-2); color: var(--ink); font: 500 16px/1.25 var(--f-body);
  box-shadow: inset 0 0 0 1px var(--line);
}
.field::placeholder { color: var(--ink-3); }
.field:focus { outline: none; box-shadow: inset 0 0 0 2px var(--focus); }
textarea.field { border-radius: 20px; min-height: 88px; resize: vertical; }

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 370px) { .grid3 { grid-template-columns: 1fr 1fr; } }

/* ---------- top bar ---------- */
.top { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; padding-top: 4px; }
.top-title { margin: 0; text-align: center; font: 700 21px/1.05 var(--f-display); letter-spacing: .03em; text-transform: uppercase; min-width: 0; }
html[lang="kn"] .top-title { text-transform: none; letter-spacing: 0; font-size: 19px; line-height: 1.3; }
.top-title small { display: block; margin-top: 2px; font: 500 12px/1.3 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- home ---------- */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand-name { margin: 0; font: 800 36px/.92 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
html[lang="kn"] .brand-name { text-transform: none; font-size: 30px; line-height: 1.2; }
.brand-sub { margin: 3px 0 0; color: var(--ink-2); font-size: 14px; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tape); box-shadow: 0 0 0 0 var(--tape); animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 75, 62, .6); } 100% { box-shadow: 0 0 0 10px rgba(255, 75, 62, 0); } }
.live .score-line { margin: 2px 0 14px; font: 700 24px/1.1 var(--f-num); }
.sec-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 4px 0; }
.sec-row .sec { margin: 0; }
.link { border: 0; background: none; color: var(--accent-ink); font-weight: 700; padding: 10px 4px; min-height: 44px; }
.list { display: grid; gap: 8px; }
.row-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  width: 100%; min-height: 64px; padding: 12px 18px; border: 0; border-radius: 22px; text-align: left;
  background: var(--s-pane); color: var(--ink); box-shadow: var(--shadow-sm), inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--rim);
}
.ri-no { font: 700 18px/1 var(--f-num); color: var(--ink-3); }
.ri-main { min-width: 0; }
.ri-main b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ri-main small { display: block; color: var(--ink-2); font-size: 13px; }
.ri-date { color: var(--ink-3); font-size: 12px; text-align: right; }
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--pane-2); font: 700 11px/1.3 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.badge.hot { background: var(--tape); color: #fff; }
.steps { margin: 14px 0 0; padding-left: 22px; display: grid; gap: 6px; color: var(--ink-2); }
.steps li::marker { color: var(--accent-ink); font-weight: 800; }
.note { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 8px 6px 18px; border-radius: 999px; background: var(--pane-2); font-size: 13px; color: var(--ink-2); }

/* ---------- tennis balls (signature) ---------- */
.balls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tb {
  --s: 40px; position: relative; flex: none; width: var(--s); height: var(--s); border-radius: 50%; overflow: hidden;
  display: grid; place-items: center; color: var(--ball-ink); font: 800 16px/1 var(--f-num);
  background: radial-gradient(circle at 32% 28%, #F7FFB8 0 7%, var(--ball) 42%, var(--ball-deep) 100%);
  box-shadow: inset -3px -4px 8px rgba(0, 0, 0, .18), 0 3px 8px rgba(0, 0, 0, .22);
}
.tb::before, .tb::after { content: ""; position: absolute; top: 0; width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .78); pointer-events: none; }
.tb::before { left: -68%; }
.tb::after { left: 68%; }
.tb b { position: relative; z-index: 1; font-weight: 800; }
.tb.tone-4 { box-shadow: 0 0 0 3px var(--four), inset -3px -4px 8px rgba(0, 0, 0, .18); }
.tb.tone-6 { box-shadow: 0 0 0 3px var(--six), inset -3px -4px 8px rgba(0, 0, 0, .18); }
.tb.tone-w { color: #fff; background: repeating-linear-gradient(-35deg, var(--tape) 0 7px, var(--tape-deep) 7px 9px); }
.tb.tone-w::before, .tb.tone-w::after { border-color: rgba(0, 0, 0, .18); }
.tb.tone-x { filter: saturate(.45) brightness(.92); }
.tb.mini { --s: 30px; font-size: 11px; }
.tb.empty { background: none; box-shadow: inset 0 0 0 2px var(--line); }
.tb.empty::before, .tb.empty::after { display: none; }
.tb-logo { --s: 46px; }

/* ---------- scoring ---------- */
.board { padding: 14px 16px 12px; overflow: hidden; background: var(--s-pane); background: radial-gradient(90% 70% at 0% 0%, color-mix(in srgb, var(--team) 30%, transparent), transparent 62%), var(--s-pane); }
.board-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
.team-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 750; color: var(--ink); min-width: 0; }
.team-tag span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-tag i, .team-dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--team); box-shadow: 0 0 0 3px color-mix(in srgb, var(--team) 30%, transparent); }
.board-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 2px; }
.score { font-family: var(--f-num); line-height: .86; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score b { font-size: 72px; font-weight: 700; letter-spacing: -.01em; }
.score span { font-size: 40px; font-weight: 600; color: var(--ink-2); }
.overs { text-align: right; font-family: var(--f-num); white-space: nowrap; }
.overs b { display: block; font-size: 32px; font-weight: 700; line-height: 1; }
.overs span { color: var(--ink-2); font-size: 14px; font-weight: 600; }
.board-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 8px; font-size: 14px; color: var(--ink-2); }
.board-foot b { color: var(--ink); font: 700 18px/1 var(--f-num); }
.need { color: var(--ink); font-weight: 750; }

.crease { display: grid; gap: 2px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.bat { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 40px; align-items: center; gap: 8px; min-height: 38px; padding: 3px 8px; border-radius: 14px; }
.bat.on { background: var(--pane-2); }
.bat .strike { display: grid; place-items: center; color: var(--accent-ink); }
.bat .bname { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bat .bname b { font-weight: 700; font-size: 16px; }
.bat .bname small { margin-left: 8px; font-size: 12px; color: var(--ink-3); }
.bat .br { font: 700 23px/1 var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.bat .bb { color: var(--ink-2); font: 600 15px/1 var(--f-num); }
.crease-foot { display: flex; align-items: center; gap: 6px 12px; padding: 8px 2px 0; margin-top: 4px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.crease-foot .bowler { display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto; }
.crease-foot .bowler b { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crease-foot .part { white-space: nowrap; }
.fig { font: 600 15px/1 var(--f-num); color: var(--ink); white-space: nowrap; }
.swap-btn { width: 40px; height: 40px; margin-left: auto; -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--pane-2); }
@media (max-width: 380px) { .crease-foot .part { display: none; } }

.tracker { padding: 6px 8px 12px 16px; }
.tracker-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tracker-top .pill { flex: none; padding-inline: 12px; }
.tracker-head { margin: 0; min-width: 0; color: var(--ink-2); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.tracker-head.hint { color: var(--four); letter-spacing: .01em; text-transform: none; font-size: 13px; }
html[lang="kn"] .tracker-head { letter-spacing: 0; font-size: 13px; }
.tracker .balls { gap: 6px; min-height: 36px; margin-top: 4px; }
.tracker .tb { --s: 34px; font-size: 15px; }
.tracker .tb.mini { --s: 26px; font-size: 10px; }

.pad { display: grid; gap: 10px; }
.mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 8px; }
.mod {
  min-height: 46px; padding: 6px 8px; border: 0; border-radius: 999px; color: var(--ink);
  font: 700 14px/1.1 var(--f-body); background: var(--s-glass);
  box-shadow: inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--rim);
}
.mod[aria-pressed="true"] { background: var(--four); color: #1D1200; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.key {
  display: grid; place-items: center; align-content: center; min-height: 64px; border: 0; border-radius: 999px;
  color: var(--ink); background: var(--s-glass); font: 700 32px/1 var(--f-num);
  box-shadow: inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--rim), var(--shadow-sm);
  transition: transform .1s ease, background-color .1s ease;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.key:active { transform: scale(.94); background: var(--glass-press); }
.key small { margin-top: 3px; font: 800 10px/1 var(--f-body); letter-spacing: .08em; color: var(--tape); }
.key.four { color: var(--four); }
.key.six { color: var(--six); }
.key.out { background: var(--tape); color: #fff; font: 800 22px/1 var(--f-display); letter-spacing: .08em; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), var(--shadow-sm); }
html[lang="kn"] .key.out { font-size: 18px; letter-spacing: 0; }

/* ---------- openers / picks ---------- */
.toss-line { margin: 0; font-weight: 650; color: var(--ink-2); }
.break { background: var(--s-pane); background: radial-gradient(90% 130% at 100% 0%, color-mix(in srgb, var(--team) 26%, transparent), transparent 62%), var(--s-pane); }
.pick-list { display: grid; gap: 8px; margin: 12px 0 4px; }
.pick {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  min-height: 56px; padding: 10px 22px; border: 0; border-radius: 999px; text-align: left;
  background: var(--pane-2); color: var(--ink); font: 650 17px/1.2 var(--f-body); box-shadow: inset 0 0 0 1px var(--line);
}
.pick small { flex: none; color: var(--ink-3); font: 600 15px/1 var(--f-num); }
.pick:disabled { opacity: .42; cursor: not-allowed; }
.pick:active:not(:disabled) { background: var(--glass-press); }

/* ---------- toss ---------- */
.toss-head { text-align: center; }
.vs-line { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; font: 800 24px/1.1 var(--f-display); text-transform: uppercase; }
html[lang="kn"] .vs-line { text-transform: none; }
.tname { color: var(--ink); text-decoration: underline; text-decoration-color: var(--team); text-decoration-thickness: 4px; text-underline-offset: 6px; }
.team-pill { min-height: 56px; background: color-mix(in srgb, var(--team) 18%, var(--pane-2)); }
.team-pill[aria-pressed="true"] { background: var(--team); color: var(--team-ink); }
.coin3d-slot { position: absolute; inset: -22px; }
.coin3d { display: block; width: 100%; height: 100%; }
.coin-stage { position: relative; height: 212px; margin: -4px 0 6px; perspective: 900px; }
.coin-shadow {
  position: absolute; left: 50%; bottom: 16px; width: 128px; height: 20px; margin-left: -64px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, .5), rgba(0, 0, 0, 0)); transform-origin: 50% 50%;
}
.coin-toss { position: absolute; left: 50%; bottom: 28px; width: 140px; height: 140px; margin-left: -70px; transform-style: preserve-3d; }
.coin { position: relative; width: 140px; height: 140px; transform-style: preserve-3d; }
.coin .face {
  position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 50%;
  -webkit-backface-visibility: hidden; backface-visibility: hidden; color: #5A3A00; transform: translateZ(4.6px);
  background:
    radial-gradient(circle at 50% 50%, transparent 0 57%, rgba(110, 68, 0, .28) 58% 59.5%, rgba(255, 236, 170, .55) 60% 61%, transparent 62%),
    radial-gradient(circle at 32% 26%, #FFF8D6 0%, #FCE291 14%, #F3C452 34%, #D99D27 58%, #AD7212 80%, #7E4F07 100%);
  box-shadow: inset 0 0 0 4px #C68D22, inset 0 0 0 6px #FFE7A3, inset 0 0 0 9px rgba(120, 76, 0, .38), inset 0 -12px 20px rgba(92, 52, 0, .38), inset 0 10px 16px rgba(255, 250, 225, .55);
}
.coin .face::before {
  /* reeded rim */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 236, 170, .9) 0 2.2deg, rgba(120, 78, 6, .85) 2.2deg 4.5deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 10px), #000 calc(100% - 9px) calc(100% - 5px), transparent calc(100% - 4.5px));
  mask: radial-gradient(circle closest-side, transparent calc(100% - 10px), #000 calc(100% - 9px) calc(100% - 5px), transparent calc(100% - 4.5px));
}
.coin .tails { transform: rotateX(180deg) translateZ(4.6px); }
.coin .emb { position: relative; width: 70px; height: 70px; fill: #7A4C04; filter: drop-shadow(0 1.5px 0 rgba(255, 246, 205, .9)) drop-shadow(0 -1px 0 rgba(84, 50, 0, .55)); }
.coin .emb .seam { stroke: #F6D377; stroke-width: 1.6; }
.coin .face small { position: relative; font: 800 11px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: #6B4402; text-shadow: 0 1px 0 rgba(255, 244, 200, .8); }
.coin .sheen { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none; }
.coin .sheen::before {
  content: ""; position: absolute; top: -20%; bottom: -20%; left: -60%; width: 70%;
  background: linear-gradient(100deg, rgba(255, 253, 240, 0) 0%, rgba(255, 253, 240, .14) 30%, rgba(255, 253, 240, .78) 50%, rgba(255, 253, 240, .14) 70%, rgba(255, 253, 240, 0) 100%);
  transform: translateX(-40%) skewX(-12deg); animation: sheenIdle 4.2s ease-in-out 1.2s infinite;
}
.coin-edge { position: absolute; inset: 0; transform-style: preserve-3d; }
.coin-edge i {
  position: absolute; inset: 1px; border-radius: 50%; transform: translateZ(var(--z));
  background: repeating-conic-gradient(from 0deg, #E8B647 0 3deg, #8F5E0B 3deg 6deg);
}
.coin.show-T { transform: rotateX(180deg); }
.coin.flip-H { animation: spinH 1.85s linear both; }
.coin.flip-T { animation: spinT 1.85s linear both; }
.coin.flip-H .sheen::before, .coin.flip-T .sheen::before { animation: sheenSpin .5s linear infinite; }
.coin-toss.go { animation: tossArc 1.85s linear both; }
.coin-shadow.go { animation: tossShadow 1.85s linear both; }
@keyframes spinH {
  0% { transform: rotateX(0deg) rotateZ(0deg); animation-timing-function: cubic-bezier(.3, .55, .55, 1); }
  78% { transform: rotateX(2160deg) rotateZ(8deg); animation-timing-function: ease-out; }
  86% { transform: rotateX(2172deg) rotateZ(4deg); animation-timing-function: ease-in-out; }
  93% { transform: rotateX(2155deg) rotateZ(-2deg); animation-timing-function: ease-in-out; }
  100% { transform: rotateX(2160deg) rotateZ(0deg); }
}
@keyframes spinT {
  0% { transform: rotateX(0deg) rotateZ(0deg); animation-timing-function: cubic-bezier(.3, .55, .55, 1); }
  78% { transform: rotateX(2340deg) rotateZ(8deg); animation-timing-function: ease-out; }
  86% { transform: rotateX(2352deg) rotateZ(4deg); animation-timing-function: ease-in-out; }
  93% { transform: rotateX(2335deg) rotateZ(-2deg); animation-timing-function: ease-in-out; }
  100% { transform: rotateX(2340deg) rotateZ(0deg); }
}
@keyframes tossArc {
  0% { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(.22, .62, .36, 1); }
  40% { transform: translateY(-150px) scale(1.14); animation-timing-function: cubic-bezier(.64, 0, .78, .4); }
  78% { transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
  86% { transform: translateY(-18px) scale(1.01); animation-timing-function: cubic-bezier(.6, 0, .8, .5); }
  93% { transform: translateY(0) scale(1); animation-timing-function: ease-out; }
  96.5% { transform: translateY(-4px); animation-timing-function: ease-in; }
  100% { transform: translateY(0); }
}
@keyframes tossShadow {
  0% { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(.22, .62, .36, 1); }
  40% { transform: scale(.42); opacity: .35; animation-timing-function: cubic-bezier(.64, 0, .78, .4); }
  78% { transform: scale(1.04); opacity: 1; }
  86% { transform: scale(.88); opacity: .85; }
  93%, 100% { transform: scale(1); opacity: 1; }
}
@keyframes sheenIdle { 0%, 52% { transform: translateX(-40%) skewX(-12deg); } 82%, 100% { transform: translateX(260%) skewX(-12deg); } }
@keyframes sheenSpin { from { transform: translateX(-40%) skewX(-12deg); } to { transform: translateX(260%) skewX(-12deg); } }
.toss-result { text-align: center; }
.toss-result .display { margin: 2px 0 12px; }

/* ---------- tie + bowl-out ---------- */
.tie-hero { text-align: center; }
.options { display: grid; gap: 10px; }
.option { display: grid; gap: 4px; width: 100%; padding: 18px 22px; border: 0; text-align: left; color: var(--ink); }
.option b { font: 800 24px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
html[lang="kn"] .option b { text-transform: none; font-size: 21px; line-height: 1.3; }
.option span { color: var(--ink-2); font-size: 14px; }
.option:active { transform: scale(.98); }
.bo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 10px; padding: 10px 12px; border-radius: 18px; }
.bo-row.turn { background: var(--pane-2); }
.bo-team { display: flex; align-items: center; gap: 8px; font-weight: 750; min-width: 0; }
.bo-team span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bo-hits { font: 700 30px/1 var(--f-num); }
.slots { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.slot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); }
.slot.hit { background: var(--ok); color: #03140C; box-shadow: none; }
.slot.miss { background: var(--tape); color: #fff; box-shadow: none; }

/* ---------- result ---------- */
.result-hero { text-align: center; padding: 26px 20px 22px; background: var(--s-pane); background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--team) 36%, transparent), transparent 66%), var(--s-pane); }
.result-hero .eyebrow { justify-content: center; }
.trophy { width: 62px; height: 62px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--ball); color: var(--ball-ink); box-shadow: 0 8px 24px var(--on-ball-glow); }
.score-lines { display: grid; gap: 4px; margin-top: 14px; }
.score-lines p { margin: 0; display: flex; justify-content: center; align-items: baseline; gap: 10px; font-size: 15px; }
.score-lines b { font: 700 22px/1 var(--f-num); }
.score-lines .so-label { justify-content: center; margin-top: 8px; font-size: 11px; }
.potm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
.potm-name { margin: 0; font: 800 30px/1.05 var(--f-display); text-transform: uppercase; overflow-wrap: anywhere; }
html[lang="kn"] .potm-name { text-transform: none; }
.potm-pts { flex: none; text-align: center; }
.potm-pts b { display: block; font: 700 34px/1 var(--f-num); color: var(--accent-ink); }
.potm-pts small { color: var(--ink-3); font-size: 12px; }
.potm-line { margin: 8px 0 0; font: 650 17px/1.3 var(--f-num); color: var(--ink-2); }
.rematch .grid3 { margin-top: 10px; }
.pick-pill { flex-direction: column; gap: 2px; margin-top: 10px; padding-block: 8px; }
.pick-pill small { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.table-wrap { overflow-x: auto; margin: 10px -2px 0; }
table.sc { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.sc th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; font-size: 12px; font-weight: 650; color: var(--ink-3); }
.sc td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; font: 600 16px/1.2 var(--f-num); }
.sc th:first-child, .sc td:first-child { text-align: left; }
.sc td:first-child { font: 650 14px/1.3 var(--f-body); }
.sc td small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 500; }
.sc-line { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.sc-line b { color: var(--ink); font: 700 18px/1 var(--f-num); }
.sc-line.total b { font-size: 22px; }
.fow { margin: 0; font: 600 15px/1.6 var(--f-num); }
.fow small { color: var(--ink-3); font-family: var(--f-body); font-size: 12px; }

/* ---------- poster ---------- */
.poster-frame { border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: #0B0E14; aspect-ratio: 4 / 5; max-width: 100%; display: grid; place-items: center; }
.poster-img { display: block; width: 100%; height: auto; }
.poster-loading { color: #B0B8C9; font-weight: 650; }

/* ---------- team setup ---------- */
.team-head { display: flex; align-items: center; gap: 12px; }
.team-head .team-dot { width: 14px; height: 14px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--team) 26%, transparent); }
.field-name { font-weight: 700; font-size: 19px; }
.saved-row { margin-top: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 10px; }
.swatch { width: 38px; height: 38px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; }
.swatch::before { content: ""; width: 26px; height: 26px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25), 0 0 0 0 var(--field), 0 0 0 0 var(--c); transition: box-shadow .25s var(--ease-out), transform .16s var(--ease-out); }
.swatch:active::before { transform: scale(.9); }
.swatch[aria-checked="true"]::before { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0), 0 0 0 3px var(--field), 0 0 0 5px var(--c); }
.roster { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 6px; }
.roster li { display: grid; grid-template-columns: 26px minmax(0, 1fr) 44px; align-items: center; gap: 6px; min-height: 46px; padding: 1px 2px 1px 14px; border-radius: 999px; background: var(--pane-2); }
.roster .num { color: var(--ink-3); font: 700 15px/1 var(--f-num); }
.roster .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-sm { width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--ink-3); display: grid; place-items: center; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.add-row .field { min-width: 0; }
.errors { margin: 0; padding: 12px 18px; border-radius: 20px; background: color-mix(in srgb, var(--tape) 16%, var(--s-pane)); color: var(--ink); font-weight: 600; display: grid; gap: 4px; }
.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 10px; font-weight: 650; }
.stepper-row .seg { flex: 0 1 210px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.num-big { min-width: 48px; text-align: center; font: 700 34px/1 var(--f-num); }

/* ---------- bottom dock, sheets, toasts (real glass) ---------- */
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 480px; margin: 0 auto; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.dock {
  display: flex; gap: 8px; padding: 8px; border-radius: 999px;
  background: var(--s-sheet); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--shadow), inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--rim);
}
.dock .pill { flex: 1; min-height: 54px; font-size: 16px; }
#sheet { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: var(--scrim); border: 0; padding: 0; cursor: default; }
.sheet .grip, .sheet .sheet-head { touch-action: none; }
.sheet {
  position: relative; width: min(480px, 100%); max-height: 88vh; max-height: 88dvh; margin: 0 auto; overflow-y: auto; overscroll-behavior: contain;
  padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 32px 32px 0 0;
  background: var(--s-sheet); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--shadow), inset 0 1px 0 var(--rim-top);
  animation: sheetUp .38s var(--ease-drawer);
}
@keyframes sheetIn { from { transform: translateY(30px); } to { transform: none; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
#sheet .scrim { animation: fadeIn .25s ease-out; }
#sheet.still .scrim, #sheet.still .sheet { animation: none; }
.ghost { position: fixed; inset: 0; z-index: 31; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; }
.grip { width: 42px; height: 5px; margin: 4px auto 12px; border-radius: 3px; background: var(--ink-3); opacity: .45; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { margin: 0; font: 800 26px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
html[lang="kn"] .sheet-head h2 { text-transform: none; letter-spacing: 0; font-size: 22px; line-height: 1.35; }
.sheet-sub { margin: 4px 0 0; color: var(--ink-2); font-weight: 600; }
.sheet .label:first-of-type { margin-top: 10px; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.sheet-actions .pill { flex: 1 1 auto; }
.sheet .grid2, .sheet .grid4 { margin-top: 4px; }
.sheet .wide { margin-top: 14px; }
.sheet .icon-btn { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--pane-2); box-shadow: inset 0 0 0 1px var(--line); }
.menu-list { display: grid; gap: 8px; margin-top: 12px; }
.menu-item { min-height: 54px; padding: 10px 22px; border: 0; border-radius: 999px; text-align: left; background: var(--pane-2); color: var(--ink); font: 650 16px/1.2 var(--f-body); box-shadow: inset 0 0 0 1px var(--line); }
.menu-item.danger { color: var(--tape); }
.rules-list { margin: 10px 0 0; padding: 0; list-style: none; display: grid; }
.rules-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.rules-list li span:last-child { font-weight: 700; text-align: right; }
.status { margin: 0; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
.status.cloud::before { background: var(--ok); }
.file-pill { cursor: pointer; }
#toast { position: fixed; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
.toast {
  max-width: 440px; padding: 12px 20px; border-radius: 999px; font-weight: 650; text-align: center;
  background: var(--s-sheet); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--shadow), inset 0 0 0 1px var(--rim); animation: sheetIn .22s ease-out;
}

/* ---------- 4 and 6: one-time pop on the over tracker ---------- */
.fx { position: relative; flex: none; display: grid; place-items: center; }
.fx .tb { animation: popFour .6s cubic-bezier(.2, 1.5, .4, 1) both; }
.fx6 .tb { animation: popSix .75s cubic-bezier(.2, 1.6, .35, 1) both; }
.fx .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--four); pointer-events: none; animation: ringOut .75s ease-out .08s both; }
.fx6 .ring { border-color: var(--six); animation-duration: .85s; }
.fx .sparks {
  position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; pointer-events: none;
  box-shadow: 0 -24px 0 0 var(--six), 17px -17px 0 0 #FFD54A, 24px 0 0 0 var(--six), 17px 17px 0 0 #FFD54A,
    0 24px 0 0 var(--six), -17px 17px 0 0 #FFD54A, -24px 0 0 0 var(--six), -17px -17px 0 0 #FFD54A;

    if (!inn) return [];
    const busy = (id) => id === inn.striker || id === inn.nonStriker;
    const pick = (st) => inn.squad.filter((id) => inn.batters[id].status === st && !busy(id));
    let list = pick('yet');
    if (!list.length && s.config.retiredReturn) list = pick('retired');
    const free = list.filter((id) => id !== inn.bowler);
    return free.length ? free : list;
  }

  /* Legality matrix: which dismissals each delivery allows. */
  function allowedDismissals(s, kind) {
    const c = s.config;
    const inn = s.innings[s.cur];
    if ((inn && inn.freeHit) || kind === 'noball') return ['runOut'];
    if (kind === 'wide') return c.hitWicket ? ['stumped', 'runOut', 'hitWicket'] : ['stumped', 'runOut'];
    const a = ['bowled', 'caught', 'stumped', 'runOut'];
    if (c.lbw) a.push('lbw');
    if (c.hitWicket) a.push('hitWicket');
    if (c.sixOut) a.push('sixOut');
    return a;
  }

  /* Bowler picker with reasons. Impossible constraints relax: cap first, then back-to-back.
     forChange = mid-over replacement ("baby over" / injury): the current bowler is left out. */
  function bowlerOptions(s, inn, forChange) {
    const c = s.config;
    const ids = squad(s.match, inn.bowl).filter((id) => id !== inn.striker && id !== inn.nonStriker &&
      (c.jokerBowls || !isJoker(s.match, id)) && !(forChange && id === inn.bowler));
    const cap = c.maxOversPerBowler > 0 && !inn.isSuper ? c.maxOversPerBowler * c.ballsPerOver : Infinity;
    const midOver = inn.overBalls > 0;
    let list = ids.map((id) => {
      const b = inn.bowlers[id];
      const balls = b ? b.balls : 0;
      let reason = null;
      if (!c.consecutiveOvers && !inn.isSuper && !midOver && id === inn.lastOverBowler) reason = 'consecutive';
      else if (balls >= cap) reason = 'cap';
      return { id, balls, reason, relaxed: null };
    });
    if (list.length && list.every((x) => x.reason)) {
      list = list.map((x) => (x.reason === 'cap' ? Object.assign({}, x, { reason: null, relaxed: 'cap' }) : x));
      if (list.every((x) => x.reason)) list = list.map((x) => Object.assign({}, x, { reason: null, relaxed: x.relaxed || x.reason }));
    }
    return list.map((x) => ({ id: x.id, balls: x.balls, disabled: !!x.reason, reason: x.reason, relaxed: x.relaxed }));
  }

  function checkEnd(s, inn) {
    if (inn.done || !inn.started) return;
    if (inn.target != null && inn.runs >= inn.target) return finish(inn, 'target');
    if (inn.wkts >= inn.maxWkts) return finish(inn, 'allout');
    const at = [inn.striker, inn.nonStriker].filter(Boolean);
    if (at.length < (inn.solo ? 1 : 2) && batterCandidates(s, inn).length === 0) {
      if (at.length === 1 && s.config.lastManStands) {
        inn.striker = at[0]; inn.nonStriker = null; inn.solo = true;
      } else {
        return finish(inn, 'allout');
      }
    }
    if (inn.balls >= inn.maxBalls) return finish(inn, 'overs');
  }

  function dismiss(inn, id, how) {
    const b = inn.batters[id];
    const credit = how !== 'runOut';
    b.status = 'out'; b.how = how; b.bowler = credit ? inn.bowler : null;
    if (credit) inn.bowlers[inn.bowler].wkts += 1;
    inn.wkts += 1;
    inn.fow.push({ n: inn.wkts, runs: inn.runs, balls: inn.balls, id });
    if (inn.striker === id) inn.striker = null;
    else if (inn.nonStriker === id) inn.nonStriker = null;
    inn.part = { runs: 0, balls: 0 };
  }

  function closeOver(inn) {
    const bw = inn.bowlers[inn.bowler];
    if (bw && inn.overRuns === 0) bw.maidens += 1;
    inn.lastOverBowler = inn.bowler;
    inn.bowler = null;
    inn.overRuns = 0; inn.overBalls = 0;
    inn.overs.push([]);
    swapEnds(inn);
  }

  function autoRetire(s, inn) {
    const lim = s.config.retireAt;
    if (!lim || inn.isSuper || inn.done) return;
    ['striker', 'nonStriker'].forEach((slot) => {
      const id = inn[slot];
      if (!id) return;
      const b = inn.batters[id];
      if (b.runs < lim || b.retiredOnce) return;
      if (!inn.squad.some((x) => inn.batters[x].status === 'yet')) return;
      b.status = 'retired'; b.retiredOnce = true; inn[slot] = null;
      inn.part = { runs: 0, balls: 0 };
    });
  }

  /* ---------- event handlers ---------- */
  function applyStart(s, inn, e) {
    if (!s.pending || s.pending.type !== 'openers') throw fail('not_expected', 'start');
    const bowlSquad = squad(s.match, inn.bowl);
    const st = e.striker, ns = e.nonStriker || null, bw = e.bowler;
    if (inn.squad.indexOf(st) < 0) throw fail('bad_striker');
    // Single-batter rule: one batter at the crease. Otherwise a missing non-striker means "bat alone" this innings.
    if (ns && (s.config.singleBatter || inn.squad.indexOf(ns) < 0 || ns === st)) throw fail('bad_non_striker');
    if (bowlSquad.indexOf(bw) < 0 || bw === st || bw === ns || (!s.config.jokerBowls && isJoker(s.match, bw))) throw fail('bad_bowler');
    inn.striker = st; inn.nonStriker = ns; inn.solo = !ns; inn.soloStart = !ns;
    [st, ns].forEach((id) => { if (id) { inn.batters[id].status = 'batting'; inn.order.push(id); } });
    inn.bowler = bw; ensureBowler(inn, bw);
    inn.started = true;
  }

  function applyBall(s, inn, e) {
    if (s.pending) throw fail('not_expected', 'ball');
    const c = s.config;
    const kind = e.kind || 'legal';
    if (kind !== 'legal' && kind !== 'wide' && kind !== 'noball') throw fail('bad_kind');
    let bat = runsArg(e.bat);
    const ext = runsArg(e.ext);
    if (kind === 'wide' && bat) throw fail('wide_has_bat_runs');
    let extType = null;
    if (ext > 0 && kind !== 'wide') {
      if (!c.byes) throw fail('byes_off');
      if (bat) throw fail('bat_and_byes');
      extType = e.extType === 'lb' ? 'lb' : 'b';
    }
    let w = e.wicket ? { how: e.wicket.how, out: e.wicket.out === 'nonStriker' ? 'nonStriker' : 'striker' } : null;
    // Gully rule: a six off a legal, non-free-hit ball is out (lost ball / neighbour's window).
    // sixOutRuns decides whether the six still counts before the batter walks.
    if (!w && kind === 'legal' && bat === 6 && c.sixOut && !inn.freeHit) w = { how: 'sixOut', out: 'striker' };
    if (w) {
      if (DISMISSALS.indexOf(w.how) < 0 || allowedDismissals(s, kind).indexOf(w.how) < 0) throw fail('dismissal_not_allowed', w.how);
      if (w.how === 'sixOut') { if (ext) throw fail('runs_on_dismissal'); bat = c.sixOutRuns ? 6 : 0; w.out = 'striker'; }
      else if (w.how !== 'runOut') { if (bat || ext) throw fail('runs_on_dismissal'); w.out = 'striker'; }
      if (w.out === 'nonStriker' && !inn.nonStriker) throw fail('no_non_striker');
    }

    const penalty = kind === 'wide' ? c.wideRuns : kind === 'noball' ? c.nbRuns : 0;
    const legal = kind === 'legal' || (kind === 'wide' && !c.wideRebowl) || (kind === 'noball' && !c.nbRebowl);
    const total = penalty + bat + ext;
    const strikerId = inn.striker, nonId = inn.nonStriker;
    const sb = inn.batters[strikerId];
    const bw = ensureBowler(inn, inn.bowler);
    const wasFreeHit = inn.freeHit;

    inn.runs += total;
    if (kind === 'wide') inn.extras.wd += penalty + ext;
    else {
      if (kind === 'noball') inn.extras.nb += penalty;
      if (extType) inn.extras[extType] += ext;
    }
    if (kind !== 'wide') {
      sb.balls += 1; sb.runs += bat;
      if (bat === 4) sb.fours += 1;
      if (bat === 6) sb.sixes += 1;
    }
    const charged = penalty + bat + (kind === 'wide' ? ext : 0);
    bw.runs += charged;
    if (kind === 'wide') bw.wd += 1;
    else if (kind === 'noball') bw.nb += 1;
    if (legal) {
      bw.balls += 1;
      if (charged === 0) bw.dots += 1;
      inn.balls += 1; inn.overBalls += 1;
    }
    inn.overRuns += charged;
    inn.part.runs += total;
    if (legal) inn.part.balls += 1;

    if (kind === 'noball' && c.freeHit) inn.freeHit = true;
    else if (kind === 'legal') inn.freeHit = false;

    const ran = kind === 'wide' ? ext : bat + ext;
    if (w) {
      const outId = w.out === 'nonStriker' ? nonId : strikerId;
      if (w.how === 'runOut' && ran % 2 === 1) swapEnds(inn);
      dismiss(inn, outId, w.how);
    } else if (ran % 2 === 1) {
      swapEnds(inn);
    }

    inn.overs[inn.overs.length - 1].push({ kind, bat, ext, et: extType, w: w ? w.how : null, runs: total, legal, fh: wasFreeHit, bowler: bw.id });

    if (legal && inn.overBalls >= c.ballsPerOver) closeOver(inn);
    checkEnd(s, inn);
    if (!inn.done) { autoRetire(s, inn); checkEnd(s, inn); }
  }

  function applyBatter(s, inn, e) {
    if (!s.pending || s.pending.type !== 'batter') throw fail('not_expected', 'batter');
    if (batterCandidates(s, inn).indexOf(e.id) < 0) throw fail('bad_batter');
    const b = inn.batters[e.id];
    if (b.status === 'yet') inn.order.push(e.id);
    b.status = 'batting';
    if (!inn.striker) inn.striker = e.id; else inn.nonStriker = e.id;
    if (e.id === inn.bowler) inn.bowler = null; // common player leaves the bowling crease to bat
  }

  function applyBowler(s, inn, e) {
    if (!s.pending || s.pending.type !== 'bowler') throw fail('not_expected', 'bowler');
    const o = bowlerOptions(s, inn).find((x) => x.id === e.id);
    if (!o || o.disabled) throw fail('bad_bowler');
    inn.bowler = e.id;
    ensureBowler(inn, e.id);
  }

  function applyChangeBowler(s, inn, e) {
    if (s.pending) throw fail('not_expected', 'changeBowler');
    if (!inn.started || inn.done || !inn.bowler) throw fail('not_live');
    const o = bowlerOptions(s, inn, true).find((x) => x.id === e.id);
    if (!o || o.disabled) throw fail('bad_bowler');
    inn.bowler = e.id;
    ensureBowler(inn, e.id);
  }

  function applySwap(s, inn) {
    if (s.pending && s.pending.type !== 'bowler') throw fail('not_expected', 'swap');
    if (!inn.started || inn.done || inn.solo || !inn.striker || !inn.nonStriker) throw fail('cannot_swap');
    swapEnds(inn);
  }

  function applyRetire(s, inn, e) {
    if (s.pending && s.pending.type !== 'bowler') throw fail('not_expected', 'retire');
    if (!inn.started || inn.done) throw fail('not_live');
    const slot = e.slot === 'nonStriker' ? 'nonStriker' : 'striker';
    const id = inn[slot];
    if (!id) throw fail('no_batter');
    const replacement = inn.squad.some((x) => x !== id && (inn.batters[x].status === 'yet' ||
      (s.config.retiredReturn && inn.batters[x].status === 'retired')));
    if (!replacement) throw fail('no_replacement');
    const b = inn.batters[id];
    b.status = 'retired'; b.retiredOnce = true; inn[slot] = null;
    inn.part = { runs: 0, balls: 0 };
  }

  function applyEnd(s, inn) {
    if (!inn.started || inn.done) throw fail('not_live');
    if (s.pending && s.pending.type !== 'batter' && s.pending.type !== 'bowler') throw fail('not_expected', 'end');
    finish(inn, 'declared');
  }

  function applyTiebreak(s, e) {
    if (!s.pending || s.pending.type !== 'tie') throw fail('not_expected', 'tiebreak');
    if (e.mode === 'share') s.result = { type: 'tie', winner: null };
    else if (e.mode === 'super') createSuper(s);
    else if (e.mode === 'bowlout') s.bowlout = { first: s.innings[s.innings.length - 1].bat, n: s.config.bowloutBalls, A: [], B: [] };
    else throw fail('bad_mode');
    s.tiebreaks.push(e.mode);
  }

  function applyBowl(s, e) {
    if (!s.pending || s.pending.type !== 'bowlout') throw fail('not_expected', 'bowl');
    s.bowlout[bowloutTurn(s.bowlout)].push(!!e.hit);
  }

  /* ---------- super over + bowl-out ---------- */
  function createSuper(s) {
    const prev = s.innings[s.innings.length - 1];
    const bat = prev.bat; // the side that batted last bats first in the super over
    const superNo = s.innings.filter((i) => i.isSuper).length / 2 + 1;
    const inn = newInnings(s, bat, { isSuper: true, superNo, maxBalls: s.config.ballsPerOver, maxWkts: Math.min(s.config.superOverWickets, totalWickets(s, bat)) });
    s.innings.push(inn); s.cur = inn.idx;
  }
  function createSuperChase(s, first) {
    const bat = first.bowl;
    const inn = newInnings(s, bat, { isSuper: true, superNo: first.superNo, maxBalls: s.config.ballsPerOver, maxWkts: Math.min(s.config.superOverWickets, totalWickets(s, bat)), target: first.runs + 1 });
    s.innings.push(inn); s.cur = inn.idx;
  }
  function bowloutTurn(bo) {
    const f = bo.first, g = other(f);
    return bo[f].length <= bo[g].length ? f : g;
  }
  function bowloutResult(bo) {
    const f = bo.first, g = other(f), n = bo.n;
    const hits = (side) => bo[side].filter(Boolean).length;
    const lf = bo[f].length, lg = bo[g].length, hf = hits(f), hg = hits(g);
    const win = (side) => ({ type: 'bowlout', winner: side, a: hits(side), b: hits(other(side)) });
    if (lf <= n && lg <= n) {
      if (hf > hg + (n - lg)) return win(f);
      if (hg > hf + (n - lf)) return win(g);
      if (lf === n && lg === n && hf !== hg) return win(hf > hg ? f : g);
      return null;
    }
    if (lf === lg && hf !== hg) return win(hf > hg ? f : g); // sudden death, decided per full round
    return null;
  }

  function mainResult(s) {
    const i1 = s.innings[0], i2 = s.innings[1];
    if (i2.runs >= i2.target) return { type: 'wickets', winner: i2.bat, margin: wicketsInHand(s, i2) - i2.wkts, ballsLeft: i2.maxBalls - i2.balls };
    if (i2.runs === i2.target - 1) return null;
    return { type: 'runs', winner: i1.bat, margin: i2.target - 1 - i2.runs };
  }
  function superResult(s, b) {
    const a = s.innings[b.idx - 1];
    if (b.runs >= b.target) return { type: 'super', winner: b.bat, superNo: b.superNo };
    if (b.runs === a.runs) return null;
    return { type: 'super', winner: a.bat, superNo: b.superNo };
  }

  /* ---------- the state machine: what must happen next ---------- */
  function settle(s) {
    s.pending = null;
    if (s.result) return;
    if (s.bowlout) {
      const r = bowloutResult(s.bowlout);
      if (r) s.result = r; else s.pending = { type: 'bowlout', side: bowloutTurn(s.bowlout) };
      return;
    }
    let inn = s.innings[s.cur];
    if (inn.done) {
      if (!inn.isSuper && inn.idx === 0) {
        const chase = newInnings(s, inn.bowl, { maxBalls: s.config.overs * s.config.ballsPerOver, target: inn.runs + 1 });
        s.innings.push(chase); s.cur = chase.idx; inn = chase;
      } else if (!inn.isSuper) {
        const r = mainResult(s);
        if (r) s.result = r; else s.pending = { type: 'tie' };
        return;
      } else if (inn.target == null) {
        createSuperChase(s, inn); inn = s.innings[s.cur];
      } else {
        const r = superResult(s, inn);
        if (r) s.result = r; else s.pending = { type: 'tie' };
        return;
      }
    }
    if (!inn.started) { s.pending = { type: 'openers' }; return; }
    if (vacancies(inn) > 0) { s.pending = { type: 'batter' }; return; }
    if (!inn.bowler) { s.pending = { type: 'bowler' }; return; }
  }

  function init(match) {
    if (!match || !match.teams || !match.teams.A || !match.teams.B) throw fail('bad_match');
    const c = normalizeConfig(match.config);
    const s = { match, config: c, innings: [], cur: 0, pending: null, result: null, bowlout: null, tiebreaks: [], n: 0 };
    s.innings.push(newInnings(s, firstBatting(match), { maxBalls: c.overs * c.ballsPerOver }));
    settle(s);
    return s;
  }

  function apply(s, e) {
    if (!e || typeof e.t !== 'string') throw fail('bad_event');
    if (s.result) throw fail('match_over');
    const inn = s.innings[s.cur];
    switch (e.t) {
      case 'start': applyStart(s, inn, e); break;
      case 'ball': applyBall(s, inn, e); break;
      case 'batter': applyBatter(s, inn, e); break;
      case 'bowler': applyBowler(s, inn, e); break;
      case 'changeBowler': applyChangeBowler(s, inn, e); break;
      case 'swap': applySwap(s, inn); break;
      case 'retire': applyRetire(s, inn, e); break;
      case 'end': applyEnd(s, inn); break;
      case 'tiebreak': applyTiebreak(s, e); break;
      case 'bowl': applyBowl(s, e); break;
      default: throw fail('bad_event', e.t);
    }
    s.n += 1;
    settle(s);
    return s;
  }

  function replay(match) {
    const s = init(match);
    (match.events || []).forEach((e) => apply(s, e));
    return s;
  }

  function tryAppend(match, e) {
    try {
      const m = Object.assign({}, match, { events: (match.events || []).concat([e]) });
      return { ok: true, state: replay(m) };
    } catch (err) {
      return { ok: false, error: (err && err.code) || String((err && err.message) || err) };
    }
  }

  /* ---------- derived numbers ---------- */
  function formatOvers(balls, bpo) { return Math.floor(balls / bpo) + '.' + (balls % bpo); }
  function runRate(runs, balls, bpo) { return balls ? (runs * bpo) / balls : 0; }
  function chaseInfo(inn, bpo) {
    if (!inn || inn.target == null) return null;
    const need = Math.max(0, inn.target - inn.runs);
    const left = Math.max(0, inn.maxBalls - inn.balls);
    return { need, left, rrr: left ? (need * bpo) / left : 0 };
  }
  function ballText(b) {
    if (b.w) return { t: b.runs ? b.runs + 'W' : 'W', tone: 'w' };
    if (b.kind === 'wide') return { t: (b.runs > 1 ? b.runs : '') + 'wd', tone: 'x' };
    if (b.kind === 'noball') return { t: 'nb' + (b.bat ? b.bat : '') + (b.ext ? '+' + b.ext + b.et : ''), tone: 'x' };
    if (b.et) return { t: b.ext + b.et, tone: 'x' };
    if (b.bat === 4) return { t: '4', tone: '4' };
    if (b.bat === 6) return { t: '6', tone: '6' };
    return { t: b.bat ? String(b.bat) : '•', tone: b.bat ? 'r' : '0' };
  }
  function card(inn) {
    return {
      batting: inn.order.map((id) => inn.batters[id]),
      dnb: inn.squad.filter((id) => inn.batters[id].status === 'yet'),
      bowling: inn.bowlerOrder.map((id) => inn.bowlers[id]).filter((b) => b.balls > 0 || b.runs > 0 || b.wkts > 0),
      extras: inn.extras, runs: inn.runs, wkts: inn.wkts, balls: inn.balls, fow: inn.fow
    };
  }

  /* Performer of the match: batting impact + bowling impact vs. the day's run rate. */
  function performers(s) {
    const bpo = s.config.ballsPerOver;
    const main = s.innings.filter((i) => !i.isSuper && i.started);
    const P = {};
    const get = (id) => P[id] || (P[id] = { id, runs: 0, balls: 0, fours: 0, sixes: 0, outs: 0, ducks: 0, bBalls: 0, bRuns: 0, wkts: 0, dots: 0, batted: false });
    main.forEach((inn) => {
      inn.order.forEach((id) => {
        const b = inn.batters[id], p = get(id);
        p.batted = true; p.runs += b.runs; p.balls += b.balls; p.fours += b.fours; p.sixes += b.sixes;
        if (b.status === 'out') { p.outs += 1; if (b.runs === 0) p.ducks += 1; }
      });
      inn.bowlerOrder.forEach((id) => {
        const w = inn.bowlers[id];
        if (!w.balls && !w.runs) return;
        const p = get(id);
        p.bBalls += w.balls; p.bRuns += w.runs; p.wkts += w.wkts; p.dots += w.dots;
      });
    });
    const runs = main.reduce((a, i) => a + i.runs, 0);
    const balls = main.reduce((a, i) => a + i.balls, 0);
    const rpo = balls ? runs / (balls / bpo) : 0;
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const r1 = (v) => Math.round(v * 10) / 10;
    const list = Object.keys(P).map((id) => {
      const p = P[id];
      let bat = 0, bowl = 0;
      if (p.batted) {
        bat = p.runs + p.fours + 2 * p.sixes;
        if (p.balls >= 6) bat += clamp((p.runs / p.balls * 100 - 100) / 10, -5, 10);
        bat += p.runs >= 50 ? 15 : p.runs >= 25 ? 8 : 0;
        bat -= 3 * p.ducks;
      }
      if (p.bBalls > 0) {
        bowl = 20 * p.wkts + p.dots + ((p.bBalls / bpo) * rpo - p.bRuns) + (p.wkts >= 3 ? 10 : 0);
      }
      return { id, team: teamOf(s.match, id), bat: r1(bat), bowl: r1(bowl), pts: r1(bat + bowl), stats: p };
    });
    list.sort((a, b) => b.pts - a.pts);
    const winner = s.result && s.result.winner;
    if (winner && list.length > 1) {
      const onWin = (x) => x.team === winner || x.team === 'J';
      if (!onWin(list[0]) && onWin(list[1]) && list[0].pts - list[1].pts <= 2) {
        const t = list[0]; list[0] = list[1]; list[1] = t;
      }
    }
    return list;
  }

  return {
    VERSION: 2, PRESETS, DISMISSALS, normalizeConfig, squad, teamOf, isJoker, firstBatting, totalWickets, other,
    replay, tryAppend, allowedDismissals, batterCandidates, bowlerOptions, vacancies,
    performers, formatOvers, runRate, chaseInfo, ballText, card
  };
});

window.GullyI18n = {

    newMatch: 'New match', liveNow: 'Live match', resume: 'Resume scoring', playAgain: 'Play again',
    againTitle: '{a} vs {b} again?', againSub: 'Same teams and rules.',
    history: 'Matches', noHistory: 'Finished matches show up here.', seeAll: 'See all', settings: 'Settings',
