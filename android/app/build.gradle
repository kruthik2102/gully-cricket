plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub workflow from repo secrets).
// Without them the release build is signed with the debug key, which installs fine but cannot update
// an install signed with the real key.
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'io.github.kruthik2102.gullycricket'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.kruthik2102.gullycricket'
        minSdk 26
        targetSdk 35
        versionCode((project.findProperty('versionCode') ?: '1') as Integer)
        versionName((project.findProperty('versionName') ?: '1.0.0') as String)
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
